<!DOCTYPE html>
{% load static %}
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BCCA Leadership Teams{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Main navigation">
            <a class="brand" href="{% url 'team_list' %}">
                <img src="{% static 'images/bcca-logo.png' %}" alt="BCCA logo">
                <span>BCCA Teams</span>
            </a>
            <ul class="nav-links">
                <li><a href="{% url 'team_list' %}">Home</a></li>
                <li><a href="{% url 'team_detail' 'management' %}">Management</a></li>
                <li><a href="{% url 'team_detail' 'procurement' %}">Procurement</a></li>
                <li><a href="{% url 'team_detail' 'community' %}">Community</a></li>
                <li><a href="{% url 'team_detail' 'documentation' %}">Documentation</a></li>
            </ul>
        </nav>
    </header>
    {% block content %}
    {% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
